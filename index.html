<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bus Ticket Booking</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f2f2f2;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        background:white;
        width:400px;
        padding:25px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    .form-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:5px;
        color:#444;
    }

    input, select{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    button{
        width:100%;
        padding:12px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#0056b3;
    }

    .ticket{
        margin-top:20px;
        padding:15px;
        background:#e9f7ef;
        border-left:5px solid green;
        display:none;
    }

    .ticket h3{
        margin-bottom:10px;
        color:green;
    }

    .ticket p{
        margin:5px 0;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Bus Ticket Booking</h2>

    <div class="form-group">
        <label>Passenger Name</label>
        <input type="text" id="name" placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label>From</label>
        <input type="text" id="from" placeholder="Starting place">
    </div>

    <div class="form-group">
        <label>To</label>
        <input type="text" id="to" placeholder="Destination">
    </div>

    <div class="form-group">
        <label>Date</label>
        <input type="date" id="date">
    </div>

    <div class="form-group">
        <label>Seats</label>
        <select id="seats">
            <option value="1">1 Seat</option>
            <option value="2">2 Seats</option>
            <option value="3">3 Seats</option>
            <option value="4">4 Seats</option>
        </select>
    </div>

    <button onclick="bookTicket()">Book Ticket</button>

    <div class="ticket" id="ticket">
        <h3>Booking Confirmed</h3>
        <p><strong>Name:</strong> <span id="tName"></span></p>
        <p><strong>Route:</strong> <span id="tRoute"></span></p>
        <p><strong>Date:</strong> <span id="tDate"></span></p>
        <p><strong>Seats:</strong> <span id="tSeats"></span></p>
        <p><strong>Ticket No:</strong> <span id="ticketNo"></span></p>
    </div>
</div>

<script>
function bookTicket() {

    let name = document.getElementById("name").value;
    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;
    let date = document.getElementById("date").value;
    let seats = document.getElementById("seats").value;

    if(name === "" || from === "" || to === "" || date === ""){
        alert("Please fill all fields");
        return;
    }

    let ticketNumber = "BUS" + Math.floor(Math.random() * 100000);

    document.getElementById("tName").innerText = name;
    document.getElementById("tRoute").innerText = from + " → " + to;
    document.getElementById("tDate").innerText = date;
    document.getElementById("tSeats").innerText = seats;
    document.getElementById("ticketNo").innerText = ticketNumber;

    document.getElementById("ticket").style.display = "block";
}
</script>

</body>
</html>
